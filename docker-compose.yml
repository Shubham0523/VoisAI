services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: voisai
      POSTGRES_PASSWORD: voisai
      POSTGRES_DB: voisai
    ports:
      - "5433:5432" # 5433 so it doesn't clash with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voisai"]
      interval: 2s
      retries: 20

volumes:
  pgdata:
